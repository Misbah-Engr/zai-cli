name: Quality
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.14.0', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: python3 scripts/terminal-smoke.py
        if: runner.os != 'Windows'
      - run: npm pack
      - run: npm install --global --ignore-scripts ./striking-lions-zc-0.2.0.tgz
      - run: zc --version
      - run: zc demo --plain
      - uses: actions/upload-artifact@v4
        with:
          name: zc-${{ matrix.os }}-node${{ matrix.node }}
          path: striking-lions-zc-0.2.0.tgz
          if-no-files-found: error
